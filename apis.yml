aid: varada
name: Varada
description: Varada was a Tel Aviv-based data lake analytics accelerator that used
  proprietary, patented adaptive indexing to dramatically speed up Trino/Presto queries
  directly on data lake storage. Backed by Lightspeed Venture Partners, Varada was
  acquired by Starburst Data on June 23, 2022, and its indexing technology and engineering
  team were folded into Starburst's query engine. The company published developer
  tooling (the vtm cluster-management CLI, a Presto/Trino workload analyzer, and a
  PowerBI Presto connector) on GitHub but no public API; the varada.io domain is now
  parked and its GitHub organization has been dormant since the acquisition.
